[project]
name = "passport-api"
version = "0.1.0"
description = "FastAPI service for the BTU AI Skills Digital Passport"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "reportlab>=5.1.0",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[project.scripts]
# run with: uv run uvicorn passport_api.main:app --reload

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "openpyxl>=3.1.5",
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
