openapi: 3.1.0
info:
  title: BTU AI Skills Digital Passport API
  version: 0.1.0
  description: |
    JSON API between the Next.js app and FastAPI.
    Pydantic models and frontend zod types must match this file.
    Outcome codes are stable. English and Georgian wording lives in the frontend.
servers:
  - url: http://localhost:8000
    description: Local backend
paths:
  /health:
    get:
      operationId: health
      summary: Process is up
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /me/passport:
    get:
      operationId: getMyPassport
      summary: Signed-in student's passport, or an empty result
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empty when this btu.edu.ge account has no passport yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/DomainRejected"
  /me/passport/versions/{version}/pdf:
    get:
      operationId: downloadPassportPdf
      summary: Download one version in the selected language
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Version"
        - name: lang
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: PDF bytes for that version and language
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/DomainRejected"
        "404":
          description: This student has no such version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The file for that language is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /verify:
    post:
      operationId: verifyCode
      summary: Public check of one verification code
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Exactly one completed outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "422":
          description: Blank code. This is not the not_found outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /internal/sync:
    post:
      operationId: runSync
      summary: Read the sheet once. Not called by the browser
      security:
        - syncToken: []
      responses:
        "200":
          description: Completed, skipped, or failed without partial versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token. Email domain must be btu.edu.ge.
    syncToken:
      type: apiKey
      in: header
      name: X-Sync-Token
  parameters:
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    DomainRejected:
      description: Google account is not a btu.edu.ge address
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Language:
      type: string
      enum: [en, ka]
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - unauthorized
            - domain_not_allowed
            - code_required
            - version_not_found
            - pdf_not_ready
            - sync_unauthorized
    Skill:
      type: object
      additionalProperties: false
      required: [skill, badge, awarded_on]
      properties:
        skill:
          type: string
        badge:
          type: string
          description: Empty string when the sheet cell is empty
        awarded_on:
          type: [string, "null"]
          description: YYYY-MM-DD, or null when unavailable
    Anchor:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, failed]
        tx_url:
          type: [string, "null"]
          format: uri
          description: Amoy explorer link. Present only when a transaction hash exists
    PassportVersion:
      type: object
      additionalProperties: false
      required:
        - version
        - issued_at
        - is_current
        - holder_name
        - verification_code
        - skills
        - anchor
      properties:
        version:
          type: integer
          minimum: 1
        issued_at:
          type: string
          format: date-time
        is_current:
          type: boolean
        holder_name:
          type: string
        verification_code:
          type: string
          description: Shown only to the owning student
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        anchor:
          $ref: "#/components/schemas/Anchor"
    Passport:
      type: object
      additionalProperties: false
      required: [passport_id, versions]
      properties:
        passport_id:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/PassportVersion"
          description: Newest version first
    PassportResponse:
      type: object
      additionalProperties: false
      required: [passport]
      properties:
        passport:
          oneOf:
            - $ref: "#/components/schemas/Passport"
            - type: "null"
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          maxLength: 64
          description: Trimmed by the server. Compared case-insensitively. Internal characters are kept.
    VerifyFound:
      type: object
      additionalProperties: false
      required: [outcome, holder_name, version, is_latest, skills, tx_url]
      properties:
        outcome:
          type: string
          enum: [valid, outdated]
        holder_name:
          type: string
        version:
          type: integer
          minimum: 1
        is_latest:
          type: boolean
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        tx_url:
          type: string
          format: uri
    VerifyNotFound:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          const: not_found
    VerifyError:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          const: error
    VerifyResult:
      oneOf:
        - $ref: "#/components/schemas/VerifyFound"
        - $ref: "#/components/schemas/VerifyNotFound"
        - $ref: "#/components/schemas/VerifyError"
      discriminator:
        propertyName: outcome
        mapping:
          valid: "#/components/schemas/VerifyFound"
          outdated: "#/components/schemas/VerifyFound"
          not_found: "#/components/schemas/VerifyNotFound"
          error: "#/components/schemas/VerifyError"
    SyncResult:
      type: object
      additionalProperties: false
      required: [status, rows_read, versions_created]
      properties:
        status:
          type: string
          enum: [completed, skipped, failed]
        rows_read:
          type: integer
          minimum: 0
        versions_created:
          type: integer
          minimum: 0
        error:
          type: [string, "null"]
          description: Set when status is failed, for example sheet_unavailable
