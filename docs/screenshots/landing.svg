<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="desk-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#152642"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </radialGradient>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3258"/>
      <stop offset="100%" stop-color="#0f1d33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c8963e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Desk -->
  <rect width="800" height="480" fill="url(#desk-bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="56" fill="#0b1424" opacity="0.8"/>
  <text x="36" y="34" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#d4af37" letter-spacing="2">BTU</text>
  <text x="82" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">BUSINESS AND TECHNOLOGY UNIVERSITY</text>
  <rect x="710" y="16" width="54" height="24" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="725" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">KA / EN</text>

  <!-- Passport Book Cover -->
  <g filter="url(#shadow)">
    <!-- Book Pages Edge -->
    <rect x="254" y="86" width="298" height="348" rx="10" fill="#f1f5f9"/>
    <!-- Book Cover -->
    <rect x="250" y="82" width="300" height="350" rx="12" fill="url(#book-grad)" stroke="#d4af37" stroke-width="2"/>
    <rect x="260" y="92" width="280" height="330" rx="8" fill="none" stroke="#d4af37" stroke-opacity="0.4" stroke-dasharray="4 2"/>

    <!-- Flourish & Monogram -->
    <text x="400" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#d4af37" letter-spacing="3">BTU · 2026</text>
    <circle cx="400" cy="180" r="32" fill="#0b1424" stroke="url(#gold)" stroke-width="2"/>
    <text x="400" y="190" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="28" fill="url(#gold)">B</text>

    <!-- Title & Description -->
    <text x="400" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#f8fafc">BTU AI Skills Passport</text>
    <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Sign in with your btu.edu.ge Google account</text>

    <!-- Buttons -->
    <rect x="310" y="296" width="180" height="36" rx="6" fill="url(#gold)"/>
    <text x="400" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0b1424">Sign in with Google →</text>

    <text x="400" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d4af37" text-decoration="underline">Verify a code</text>
    
    <text x="400" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#64748b" letter-spacing="1">BUSINESS AND TECHNOLOGY UNIVERSITY</text>
  </g>

  <!-- Notice -->
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">OFFICIAL DIGITAL CREDENTIAL · TBILISI</text>
</svg>
